name: Import publications

on:
  push:
    branches:
      - main
    paths:
      - publications.bib
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Import publications from BibTeX
        run: pixi run import-pubs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: import publications from BibTeX'
          title: 'Import publications from BibTeX'
          body: |
            Auto-generated by the import-publications workflow.
            Updates publication pages from `publications.bib`.
          branch: import-publications
          delete-branch: true
