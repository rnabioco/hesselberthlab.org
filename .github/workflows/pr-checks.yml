name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Nothing ran on pull requests before this: both other workflows are
# push-to-main or scheduled, so a PR that broke the build was only visible as a
# red Netlify preview, if anyone looked.
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Install Node dependencies
        run: pixi run setup

      # A lab member's papers only reach their profile page if the publication
      # front matter uses their data/authors slug. BibTeX spells one person
      # several ways, so this drifts silently — Jay's page listed 8 of his 86
      # papers before it was caught.
      - name: Author entries point at profiles
        run: pixi run python scripts/normalize_authors.py --check

      # Built with a localhost baseURL so Lighthouse can load the assets; the
      # production baseURL comes from hugo.yaml on Netlify.
      - name: Build
        run: HUGO_BASEURL=http://localhost/ pixi run build

      - name: Every People profile link resolves
        run: |
          missing=0
          for f in data/authors/*.yaml; do
            slug=$(basename "$f" .yaml)
            if [ ! -f "public/authors/$slug/index.html" ]; then
              echo "::error::/authors/$slug/ has no page — the People card links to a 404"
              missing=1
            fi
          done
          exit $missing

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
