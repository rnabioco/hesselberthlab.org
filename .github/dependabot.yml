# Dependency updates. The site has three machine-readable dependency sets and
# one that Dependabot cannot see:
#
#   .github/workflows/*.yml  actions      -> github-actions, below
#   package.json             Tailwind etc -> npm, below
#   go.mod                   HugoBlox     -> deliberately not covered
#   pixi.toml / pixi.lock    Hugo, Go, Node, Python, academic
#
# There is no pixi ecosystem, so the toolchain pins in pixi.toml stay manual.
#
# gomod is left out on purpose. The HugoBlox modules are pinned to commits on
# their default branch, and Dependabot prefers a semver tag to a pseudo-version
# even when the tag is older: its first three pull requests moved blox from a
# January 2026 commit back to the v0.12.0 tag, whose templates still use
# `site.Locale` and no longer build. Update the theme with `hugo mod get -u`
# instead.
# Anything Dependabot opens is built by the PR checks workflow before it can be
# merged, which is what makes a theme or Tailwind bump safe to take.
version: 2

updates:
  # Actions drift quietly and are the cheapest thing here to keep current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Denver
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Tailwind, Pagefind and Preact, via pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Denver
    commit-message:
      prefix: deps
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
