<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 283" role="img"
     aria-label="Hesselberth Lab — Omnia Omni Tempore">
  <title>Hesselberth Lab</title>

  <!-- Redrawn from the original raster logo. Everything uses currentColor and a
       transparent ground, so it inherits the page's text colour and works on
       cream or in dark mode without a white box behind it. -->

  <g fill="none" stroke="currentColor" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Three pointy-top hexagons sharing their vertical edges -->
    <path d="M90 55 L170 100 L170 190 L90 235 L10 190 L10 100 Z"/>
    <path d="M250 55 L330 100 L330 190 L250 235 L170 190 L170 100 Z"/>
    <path d="M410 55 L490 100 L490 190 L410 235 L330 190 L330 100 Z"/>

    <!-- 1. Branched molecule: a stem that splits to three capped ends -->
    <path d="M30 145 H62"/>
    <path d="M62 145 L88 145"/>
    <path d="M88 145 L112 116"/>
    <path d="M88 145 L112 174"/>
    <circle cx="88" cy="145" r="11" fill="currentColor" stroke="none"/>
    <circle cx="120" cy="108" r="10"/>
    <circle cx="120" cy="182" r="10"/>
  </g>

  <!-- 2. Gene model over a coverage track -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linejoin="round">
    <rect x="192" y="98" width="116" height="15" fill="none"/>
    <path d="M236 105.5 l9 -5 v10 z" fill="currentColor" stroke="none"/>
    <path d="M192 133 H308" fill="none" stroke-linecap="round"/>
  </g>
  <g fill="currentColor">
    <rect x="192" y="127" width="30" height="12"/>
    <rect x="238" y="127" width="16" height="12"/>
    <rect x="272" y="127" width="36" height="12"/>
    <!-- coverage skyline -->
    <path d="M192 182 v-16 h5 v-9 h5 v13 h5 v-20 h5 v24 h5 v-11 h5 v11 h5 v-6 h5 v6 z"/>
    <path d="M242 182 v-13 h5 v-8 h5 v16 h5 v-19 h5 v24 z"/>
    <path d="M277 182 v-18 h5 v-8 h5 v15 h5 v-21 h5 v22 h5 v-9 h5 v19 z"/>
  </g>

  <!-- 3. Double helix with base-pair rungs.

       Two sine strands, half a period out of phase, over two full periods:
       x 350..474, period 62, amplitude 32 about y=145. Each half period is one
       cubic whose control points sit at 1/3 and 2/3 with y offset 4A/3, which
       puts the curve's midpoint exactly at the amplitude. Rungs span strand to
       strand, so their length follows A*sin and they vanish at the crossings
       rather than poking out past the strands. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <path d="M350 145 C363.8 102.4 377.6 102.4 391.3 145
             C405.1 187.6 418.9 187.6 432.7 145
             C446.5 102.4 460.3 102.4 474 145"/>
    <path d="M350 145 C363.8 187.6 377.6 187.6 391.3 145
             C405.1 102.4 418.9 102.4 432.7 145
             C446.5 187.6 460.3 187.6 474 145"/>
    <g stroke-width="3">
      <path d="M360 123 V167"/>
      <path d="M370.7 113 V177"/>
      <path d="M381 122.4 V167.6"/>
      <path d="M401 122.4 V167.6"/>
      <path d="M412 113 V177"/>
      <path d="M423 122.4 V167.6"/>
      <path d="M443 122.4 V167.6"/>
      <path d="M453.3 113 V177"/>
      <path d="M464 123 V167"/>
    </g>
  </g>

  <!-- Wordmarks. Bold italic condensed sans, letterspaced, as in the original. -->
  <g fill="currentColor" text-anchor="middle"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
     font-weight="800" font-style="italic">
    <text x="250" y="33" font-size="36" letter-spacing="4.5">HESSELBERTH LAB</text>
    <text x="250" y="274" font-size="34" letter-spacing="3.5">OMNIA OMNI TEMPORE</text>
  </g>
</svg>
