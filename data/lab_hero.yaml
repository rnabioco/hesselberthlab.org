# Homepage hero (name, tagline, portrait and links), rendered by
# layouts/_shortcodes/lab-hero.html. Plain text and URLs only — no HTML —
# so these are safe to edit without breaking markup.

eyebrow: RNA Technology & Therapeutics · CU School of Medicine
title: Hesselberth Lab
lede: >-
  A collaborative lab of RNA biologists, technology developers and data
  analysts, discovering and translating fundamental principles of RNA
  regulation — from how transfer RNA links the RNA and protein worlds, to
  RNA therapies built with clinicians at Children's Hospital Colorado.

image:
  src: /media/lab-portrait.png
  alt: The Hesselberth Lab
  width: 1018
  height: 522

