# "What we study" cards on the homepage, rendered by
# layouts/_shortcodes/research-areas.html. Plain text only — no HTML — so
# these are safe to edit without breaking markup. The card number is derived
# from list order. Mixed-case acronyms listed under `acronyms` are styled
# (wrapped in .nocaps) automatically by the shortcode, wherever they appear
# in a body or tag.

acronyms:
  - tRNA
  - mRNA
  - RNA
  - ASO
  - NMD

areas:
  - title: RNA technology
    body: >-
      We build sequencing methods and the software that makes sense of them:
      nanopore direct sequencing that reads modification and aminoacylation
      state on intact tRNAs. We also developed single-cell and spatial approaches that
      measure biochemical activity alongside gene expression. Applied with
      collaborators, they track how antigen and viral RNA move through the
      lymph node to initiate immune reponses.
    tags:
      - Nanopore
      - Single-cell
      - Spatial
      - Open software

  - title: RNA biology
    body: >-
      We study how cleavage, end
      modification and processing are integrated into an RNA damage response,
      combining genetics, biochemistry and bioinformatics. We also study
      how tRNAs are using during bacterial infection by viruses, and how
      tRNA misaminoacylation impacts protein synthesis.
    tags:
      - RNA damage & repair
      - tRNAs in translation

  - title: RNA therapy
    body: >-
      With clinicians at Children's Hospital Colorado we developed a pipeline for
      antisense oligonucleotides that correct disease-causing splicing. The
      current focus is cryptic splicing — most recently an ASO that restores a
      ciliogenesis factor lost to a splicing mutation — alongside mRNA vaccine
      work with immunologists at CU Anschutz.
    tags:
      - Antisense oligos
      - Cryptic splicing
      - Children's Hospital Colorado
