# Laura White appears here and as a card under Friends of the Lab: she is both
# a former graduate student and a current collaborator.
#
# `position` and `url` for the first five came from the lab's own farewell
# notes in the old Jekyll site (_news/2023/summer-updates.md), so they are
# accurate as of 2023 and worth re-checking. Entries with no `position` show
# just a name and a link; entries with no `contact` leave that cell empty.
# `contact` takes any profile URL — the label is derived from the host.
#
# Still unaccounted for from the old site's people photographs: Ashlyn Stahly
# (MSTP > MOLB student, 2023) and Kelly McEntee (PRA, 2023, who publishes as
# Kelleen E McEntee and is first author on the 2025 Bardet-Biedl paper, so may
# not be an alum at all).
#
# `category` is the person's role in the lab; "former" is implied by the
# section, so it reads "Graduate student" rather than "Former graduate
# student", matching "RBI fellow".

