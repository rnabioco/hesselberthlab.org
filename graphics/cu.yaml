  - name: area-trna
    aspect-ratio: "4:3"
    description: >
      A single unpaired strand of RNA threading down through a narrow
      protein pore set in a membrane, with the electrical trace it produces
      running underneath. The strand is single-stranded, not a double helix.

  - name: area-therapeutics
    aspect-ratio: "4:3"
    description: >
      A short therapeutic oligonucleotide pairing with a much
      longer RNA transcript, with a section of the transcript looped out and
      skipped over.

  - name: area-immunity
    aspect-ratio: "4:3"
    description: >
      A cell holding a few small archived fragments inside it, with
      another immune cell approaching to inspect them.

  - name: lab-logo
    aspect-ratio: "16:9"
    n: 3
    description: >
      A refined redrawing of the laboratory logo shown in [lab-logo], keeping
      its row of interlocking hexagons and its overall proportions, and keeping
      the small scientific motifs held inside the hexagons. Render it as a
      clean emblem on a warm cream ground rather than flat white, so it sits on
      the page without a visible box. Do not reproduce the wordmark or any
      lettering.
