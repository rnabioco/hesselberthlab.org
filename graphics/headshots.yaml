# Lab member headshots, generated with bananarama.
#
#   pixi run -e graphics headshots
#
# Output goes straight to assets/media/authors/<name>.png, which is where the
# team-showcase block looks for a profile's avatar. The `name` here MUST match
# the slug of the profile in data/authors/<slug>.yaml.
#
# HOW THIS IS MEANT TO BE USED
#
# Each entry stylises a real photograph rather than inventing a face. Put the
# source photo at graphics/<name>.png (or .jpg) and reference it in the
# description with [<name>] — bananarama passes it to the model as a reference
# image. Without a reference you get a synthetic likeness of a person who does
# not exist, which is not what a lab roster should show.
#
# Two things worth settling before running this over the whole lab:
#   - ask people first; it is their face
#   - keep the result visibly illustrated, not photoreal, so nobody mistakes it
#     for a photograph. The style below is deliberately a drawing.
#
# If you would rather just use the photographs as they are, that is a perfectly
# good answer — drop the file into assets/media/authors/<slug>.png and skip all
# of this.

output-dir: ../assets/media/authors

defaults:
  model: gemini-3.1-flash-image-preview
  aspect-ratio: "1:1"

  style: >
    Flat vector portrait illustration, head and shoulders, squarely framed and
    centred. Warm cream background (#FAF7F0), no scenery. Restrained palette of
    CU gold (#CFB87C), deep gold (#8C7332), near-black ink (#1C1B19) and warm
    grey (#565A5C). Even-weight linework, simple flat shapes, no gradients, no
    drop shadows, no text. Clearly an illustration rather than a photograph,
    while keeping the person recognisable. Neutral, friendly expression.

# Uncomment and extend once the roster and the source photos are in place.
# The name on the left must match data/authors/<slug>.yaml.
#
# images:
#   - name: jay-hesselberth
#     description: >
#       A portrait of the person shown in [jay-hesselberth], keeping their
#       hair, glasses and face shape recognisable.
images: []
