  - name: footer-panorama
    aspect-ratio: "21:9"
    description: >
      A wide panorama of the Colorado range shown in [colin-lloyd]: snow-capped
      peaks along the skyline, rounded foothills below them and a run of sand
      dunes in front, built from flat overlapping bands that lighten towards the
      horizon. The ridge sits low in the frame with empty, uncluttered sky above
      it, so the whole image reads as a band along the bottom edge. No clouds,
      people, buildings, roads or lettering.

  - name: sharing
    aspect-ratio: "16:9"
    description: >
      A transfer RNA folded into its cloverleaf shape, sitting left of
      centre with open space to the right, and a small amino acid attached at
      the top of its acceptor stem.

  - name: area-trna
    aspect-ratio: "4:3"
    description: >
      A single unpaired strand of RNA threading down through a narrow
      protein pore set in a membrane, with the electrical trace it produces
      running underneath. The strand is single-stranded, not a double helix.

  - name: area-therapeutics
    aspect-ratio: "4:3"
    description: >
      A short therapeutic oligonucleotide pairing with a much
      longer RNA transcript, with a section of the transcript looped out and
      skipped over.

  - name: area-immunity
    aspect-ratio: "4:3"
    description: >
      A cell holding a few small archived fragments inside it, with
      another immune cell approaching to inspect them.
