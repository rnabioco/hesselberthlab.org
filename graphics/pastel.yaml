# Lab portraits and science illustrations — pastel variant.
# Muted chalk pastels, following the style described in
# https://tidydesign.substack.com/p/illustrating-my-slides-with-ai
#
#   pixi run -e graphics pastel     # 22 images, ~$1.47
#
# Renders to graphics/out/pastel/ (gitignored) so the two variants can be
# compared side by side before either is promoted into assets/media/.
# Portrait `name`s are the eventual data/authors/<slug>.yaml slugs; the
# bracketed reference is the source photograph's filename.
#
# The two configs share one subject list and differ only in the palette
# paragraph below — keep the subjects in step.

output-dir: out/pastel

defaults:
  model: gemini-3.1-flash-image-preview
  n: 1
  style: >
    Flat vector editorial illustration with a prominent grainy, chalk-pastel
    texture overlaid on the entire image. The style is lineless, relying on
    colour blocking and soft, textured shading to define forms: no visible
    pen, pencil or ink outlines, and no cross-hatching.
    The colour palette is muted and desaturated throughout, built from chalky
    pastels: dusty rose, pale sage, soft slate blue, muted terracotta and warm
    sand. Each image leans on a different pastel so a set reads as varied.
    Calm and unfussy. No lettering or text of any kind.

images:
  - name: jay-hesselberth
    aspect-ratio: "1:1"
    description: >
      A head-and-shoulders portrait of the person shown in [jay-hesselberth], squarely
      framed and centred, keeping their face, glasses and hair recognisable.
      Neutral, friendly expression. Frame from the chest up so both
      shoulders are visible, with a little space above the head, never a
      tight crop of the face alone.
      Fill the whole square edge to edge, with no border, frame or
      margin. The background is a single flat block of colour, never a gradient
      or a glow.

