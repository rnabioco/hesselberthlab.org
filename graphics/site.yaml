# Science illustrations for hesselberthlab.org.
#
#   pixi run -e graphics graphics     # 4 images, ~$0.27
#
# Output goes to graphics/out/ (gitignored) alongside the portraits, so the
# whole set can be reviewed together before anything is promoted into
# assets/media/. Copy a chosen render to assets/media/<name>.png to use it.
#
# The `sharing` name is special: layouts/_partials/site_head.html resolves the
# social card with `resources.GetMatch (path.Join "media" "sharing.*")`, so
# dropping a render at assets/media/sharing.png sets og:image site-wide and
# upgrades the Twitter card from `summary` to `summary_large_image` — no
# template or config change needed.

output-dir: out

defaults:
  model: gemini-3.1-flash-image-preview
  aspect-ratio: "16:9"
  n: 1

  # Same house style as graphics/trial.yaml — keep the two in step.
  # Following https://tidydesign.substack.com/p/illustrating-my-slides-with-ai:
  # lineless colour blocking, chalk-pastel texture, and a loose brief.
  style: >
    Flat vector editorial illustration with a prominent grainy, chalk-pastel
    texture overlaid on the entire image. The style is lineless, relying on
    colour blocking and soft, textured shading to define forms. The palette is
    muted and desaturated throughout: warm cream and soft gold, lifted with
    chalky pastels — dusty rose, pale sage, soft slate blue, muted terracotta.
    Generous negative space. Calm, unfussy and a little diagrammatic, but not a
    technical figure. No lettering or text of any kind.

images:
  - name: sharing
    description: >
      A transfer RNA folded into its cloverleaf shape, sitting left of centre
      with open space to the right, and a small amino acid attached at the top
      of its stem.

  - name: area-trna
    aspect-ratio: "4:3"
    description: >
      A strand of RNA threading down through a narrow pore set in a membrane,
      with the electrical trace it produces running underneath.

  - name: area-therapeutics
    aspect-ratio: "4:3"
    description: >
      A short therapeutic oligonucleotide pairing with a much longer RNA
      transcript, with a section of the transcript being looped out and skipped.

  - name: area-immunity
    aspect-ratio: "4:3"
    description: >
      A cell holding a few small archived fragments inside it, with another
      immune cell approaching to inspect them.
