# Lab portraits, drawn from the real photographs.
#
#   pixi run -e graphics trial     # 8 images, ~$0.54
#
# Output goes to graphics/out/ (gitignored) and is reviewed before anything is
# promoted. This must never write over assets/media/authors/, where the real
# photographs live.
#
# Consistency across the set comes from every image sharing one style block,
# one aspect ratio and one model — not from a style reference image, which
# tends to bleed one person's features into another's portrait.
#
# `name` is the eventual data/authors/<slug>.yaml slug, so a chosen render can
# be copied straight to assets/media/authors/<slug>.png. The bracketed
# reference is the source photo's filename, which is just a first name.

output-dir: out

defaults:
  model: gemini-3.1-flash-image-preview
  aspect-ratio: "1:1"
  n: 1

  # Following https://tidydesign.substack.com/p/illustrating-my-slides-with-ai:
  # lineless colour blocking, chalk-pastel texture, and a loose brief.
  # Warm cream and gold are the CU palette (data/themes/cu-anschutz.yaml);
  # the chalky pastels keep a set of portraits from all looking identical.
  style: >
    Flat vector editorial illustration with a prominent grainy, chalk-pastel
    texture overlaid on the entire image. The style is lineless, relying on
    colour blocking and soft, textured shading to define forms. The palette is
    muted and desaturated throughout: warm cream and soft gold, lifted with
    chalky pastels — dusty rose, pale sage, soft slate blue, muted terracotta —
    used across the background and clothing so each portrait is tinted a little
    differently while the set still reads as one family. Calm and unfussy.
    No lettering or text of any kind.

  description: >
    A head-and-shoulders portrait, squarely framed and centred, on a plain
    background. Neutral, friendly expression.

images:
  - name: jay-hesselberth
    force: true # redraw: the earlier render predates the pastel palette
    description: >
      A head-and-shoulders portrait of the person shown in [jay-hesselberth],
      keeping their face, glasses and hair recognisable. Plain background,
      neutral friendly expression.

