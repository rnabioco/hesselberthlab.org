hugoblox:
  schema: "2.0"

  identity:
    name: "Hesselberth Lab"
    organization: "University of Colorado School of Medicine"
    type: organization
    tagline: "RNA Technology & Therapeutics"
    description: "The Hesselberth Lab discovers and translates fundamental principles of RNA regulation — from how transfer RNA links the RNA and protein worlds to RNA therapies for pediatric genetic disease — at the University of Colorado School of Medicine."
    social:
      twitter: ""

  theme:
    mode: light
    pack: "cu-anschutz"
    colors:
      primary: ""
      secondary: ""
      neutral: ""
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  typography:
    font: "serif"
    size: "sm"

  layout:
    radius: "sm"
    spacing: "compact"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: false
