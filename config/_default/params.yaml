      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  seo:
    title: "Hesselberth Lab"
    location:
      address:
        street: ""
        city: "Aurora"
        region: "CO"
        postal_code: "80045"
        country: "US"
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: ""
      contact: ""

  content:
